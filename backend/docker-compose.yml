# Postgres only, published on localhost:5432, for running the API and web app
# with npm during development (matches backend/.env.example's DATABASE_URL).
# To run the whole stack in containers, use the repo-root docker-compose.yml.
services:
  postgres:
    image: postgres:16-alpine
    container_name: mofin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mofin
    ports:
      - '5432:5432'
    volumes:
      - mofin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mofin']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mofin_pgdata:
