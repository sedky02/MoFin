appId: com.sedky02.mofin
# Expects the sign-in screen. Credentials come from env: MAESTRO_EMAIL, MAESTRO_PASSWORD.
---
- extendedWaitUntil:
    visible: "Email"
    timeout: 20000
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"
