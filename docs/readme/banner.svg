<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">MoFin</title>
  <desc id="d">MoFin logo with the tagline: Know where your money goes. Log spending yourself, or let Claude or ChatGPT draft it, and nothing counts until you approve it.</desc>
  <defs>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#D7F205" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D7F205" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F4F4EF" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="420" rx="28"/></clipPath>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 1.1s cubic-bezier(.2,.9,.25,1.15) both; }
    .b1 { animation-delay: .15s } .b2 { animation-delay: .3s } .b3 { animation-delay: .45s }
    .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
    .r1 { animation-delay: .55s } .r2 { animation-delay: .75s } .r3 { animation-delay: .95s } .r4 { animation-delay: 1.15s }
    .glow { animation: breathe 6s ease-in-out infinite; transform-origin: 980px 140px; }
    .col { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 1s cubic-bezier(.2,.9,.25,1.1) both, bob 5s ease-in-out infinite; }
    .c1 { animation-delay: 1.0s, 2.2s } .c2 { animation-delay: 1.1s, 2.6s } .c3 { animation-delay: 1.2s, 3.0s }
    .c4 { animation-delay: 1.3s, 3.4s } .c5 { animation-delay: 1.4s, 3.8s } .c6 { animation-delay: 1.5s, 4.2s }
    .chip { animation: rise .8s 1.9s cubic-bezier(.2,.8,.2,1) both; }
    .pending { animation: swapOut 6s 2.6s infinite; }
    .approved { animation: swapIn 6s 2.6s infinite; opacity: 0; }
    .dot { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes grow { from { transform: scaleY(0) } to { transform: scaleY(1) } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    @keyframes breathe { 0%,100% { opacity: .75; transform: scale(1) } 50% { opacity: 1; transform: scale(1.08) } }
    @keyframes bob { 0%,100% { transform: scaleY(1) } 50% { transform: scaleY(.9) } }
    @keyframes swapOut { 0%,40% { opacity: 1 } 46%,94% { opacity: 0 } 100% { opacity: 1 } }
    @keyframes swapIn { 0%,40% { opacity: 0 } 46%,94% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1 } 50% { transform: scale(1.6); opacity: .4 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .approved { opacity: 0 } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="#11120D"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <rect class="glow" width="1200" height="420" fill="url(#glow)"/>

    <g transform="translate(80 92)">
      <rect width="88" height="88" rx="22" fill="#D7F205"/>
      <g fill="#11120D">
        <rect class="bar b1" x="19.25" y="33" width="13.75" height="33" rx="4"/>
        <rect class="bar b2" x="37.1" y="45.8" width="13.75" height="20.2" rx="4"/>
        <rect class="bar b3" x="55" y="20.2" width="13.75" height="45.8" rx="4"/>
      </g>
    </g>
    <text class="rise r1" x="190" y="164" font-size="76" font-weight="700" letter-spacing="-3" fill="#F4F4EF">MoFin</text>

    <text class="rise r2" x="80" y="250" font-size="40" font-weight="700" letter-spacing="-1.2" fill="#F4F4EF">Know where your money goes.</text>
    <text class="rise r3" x="80" y="292" font-size="19" fill="#9A9D95">A personal finance app. Log what you spend yourself,</text>
    <text class="rise r3" x="80" y="318" font-size="19" fill="#9A9D95">or let Claude or ChatGPT draft it. Nothing counts until you approve it.</text>
    <g class="rise r4" font-size="14" font-weight="600">
      <rect x="80" y="346" width="96" height="30" rx="15" fill="none" stroke="#3A3C36"/>
      <text x="128" y="366" text-anchor="middle" fill="#D7F205">NestJS</text>
      <rect x="186" y="346" width="96" height="30" rx="15" fill="none" stroke="#3A3C36"/>
      <text x="234" y="366" text-anchor="middle" fill="#D7F205">Next.js</text>
      <rect x="292" y="346" width="86" height="30" rx="15" fill="none" stroke="#3A3C36"/>
      <text x="335" y="366" text-anchor="middle" fill="#D7F205">Expo</text>
      <rect x="388" y="346" width="76" height="30" rx="15" fill="none" stroke="#3A3C36"/>
      <text x="426" y="366" text-anchor="middle" fill="#D7F205">MCP</text>
    </g>

    <g transform="translate(820 40)">
      <rect width="300" height="226" rx="20" fill="#1A1A17" stroke="#2E2E2B"/>
      <text x="24" y="40" font-size="13" fill="#9A9D95">Balance · USD</text>
      <text x="24" y="78" font-size="34" font-weight="700" letter-spacing="-1" fill="#F4F4EF">$15,039.10</text>
      <line x1="24" y1="200" x2="276" y2="200" stroke="#2E2E2B"/>
      <g fill="#3A3C36">
        <rect class="col c1" x="28" y="158" width="28" height="42" rx="6"/>
        <rect class="col c2" x="70" y="142" width="28" height="58" rx="6"/>
        <rect class="col c3" x="112" y="150" width="28" height="50" rx="6"/>
        <rect class="col c4" x="154" y="128" width="28" height="72" rx="6"/>
        <rect class="col c5" x="196" y="116" width="28" height="84" rx="6"/>
        <rect class="col c6" x="238" y="104" width="28" height="96" rx="6" fill="#D7F205"/>
      </g>
    </g>

    <g transform="translate(776 298)"><g class="chip">
      <rect width="316" height="64" rx="16" fill="#F4F4EF" stroke="#11120D" stroke-width="2"/>
      <text x="20" y="27" font-size="12" font-weight="600" fill="#6F6F68">“coffee with Sam, 4.50”</text>
      <text x="20" y="48" font-size="15" font-weight="700" fill="#11120D">Dining out · −$4.50</text>
      <g class="pending">
        <rect x="200" y="19" width="98" height="26" rx="13" fill="#11120D"/>
        <circle class="dot" cx="218" cy="32" r="4" fill="#D7F205"/>
        <text x="230" y="37" font-size="12" font-weight="700" fill="#F4F4EF">Draft</text>
      </g>
      <g class="approved">
        <rect x="200" y="19" width="98" height="26" rx="13" fill="#D7F205"/>
        <path d="M211 32l4 4 8-8" fill="none" stroke="#11120D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="227" y="37" font-size="12" font-weight="700" fill="#11120D">Approved</text>
      </g>
    </g></g>
  </g>
</svg>
